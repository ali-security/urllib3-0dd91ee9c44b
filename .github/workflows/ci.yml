name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest args (e.g. test path / -k expr) appended to the nox session"
        required: false
        default: ""

permissions:
  contents: "read"

defaults:
  run:
    shell: bash
env:
  FORCE_COLOR: 1

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          persist-credentials: false

      - name: "Setup Python"
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.x"
          cache: "pip"

      - name: "Check packages"
        run: |
          python -m pip install -U pip setuptools wheel build twine rstcheck
          python -m build
          rstcheck --ignore-messages "(Duplicate implicit target name:.*)" CHANGES.rst
          python -m twine check dist/*

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os:
          - macos-15
          - windows-latest
          - ubuntu-24.04
        nox-session: ['']
        include:
          - experimental: false
          # integration
          # 3.9 has a known issue with large SSL requests that we work around:
          # https://github.com/urllib3/urllib3/pull/3181#issuecomment-1794830698
          - python-version: "3.9"
            os: ubuntu-24.04
            experimental: false
            nox-session: test_integration
          - python-version: "3.12"
            os: ubuntu-24.04
            experimental: false
            nox-session: test_integration
          # pypy
          - python-version: "pypy-3.10"
            os: ubuntu-24.04
            experimental: false
            nox-session: test-pypy3.10
          - python-version: "pypy-3.11-v7.3.20"
            os: ubuntu-24.04
            experimental: false
            nox-session: test-pypy3.11
          - python-version: "3.x"
          # brotli
            os: ubuntu-24.04
            experimental: false
            nox-session: test_brotlipy
          - python-version: "3.12"
            os: ubuntu-24.04
            nox-session: emscripten(node)
            experimental: true
          - python-version: "3.12"
            os: ubuntu-24.04
            nox-session: emscripten(firefox)
            experimental: true
          - python-version: "3.12"
            os: ubuntu-24.04
            nox-session: emscripten(chrome)
            experimental: true
          - python-version: 3.14
            experimental: true

    runs-on: ${{ matrix.os }}
    name: ${{ fromJson('{"macos-15":"macOS","windows-latest":"Windows","ubuntu-24.04":"Ubuntu"}')[matrix.os] }} ${{ matrix.python-version }} ${{ matrix.nox-session}}
    timeout-minutes: 30
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          fetch-depth: 0 # Needed to fetch the version from git
          persist-credentials: false

      # Pin CPython to the patch releases current at urllib3 2.4.0's release
      # (2025-04-10). Newer security releases changed behavior the 2.4.0 test
      # suite predates: "check_hostname requires server_hostname" is raised in
      # wrap_socket before touching the socket (test_start_closed_socket), and
      # 3.13.16+/3.14 zlib flush raises on trailing garbage
      # (test_chunked_decoding_gzip_swallow_garbage). 3.14 is pinned to 3.14.0a5,
      # the last pre-release before CPython merged typing.Union into
      # types.UnionType (3.14.0a6), which breaks importing the uv.lock-pinned
      # httpcore 1.0.7. "3.x" resolved to 3.13 at release time.
      # matrix.python-version itself stays unchanged so job names and nox
      # session names (test-<python-version>) are untouched. Non-Linux runners
      # only ship the last binary release of 3.10-3.12, which already passes.
      - name: "Resolve release-era Python version"
        id: pyver
        shell: bash
        env:
          PYVER: ${{ matrix.python-version }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          v="$PYVER"
          case "$PYVER" in
            3.13) v=3.13.3 ;;
            3.14) v=3.14.0-alpha.5 ;;
            3.x) v=3.13.3 ;;
          esac
          if [ "$RUNNER_OS_NAME" = "Linux" ]; then
            case "$PYVER" in
              3.10) v=3.10.17 ;;
              3.11) v=3.11.12 ;;
              3.12) v=3.12.10 ;;
            esac
          fi
          echo "Resolved $PYVER -> $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: "Setup Python ${{ matrix.python-version }}"
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ steps.pyver.outputs.version }}
          allow-prereleases: true

      - name: "Install uv"
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          version: "0.5.20"

      # Chrome 135 is the stable release at urllib3 2.4.0's release; Chrome >=137 enables WebAssembly JSPI by default, which the [chrome-False] emscripten tests assert is absent.
      - name: "Install Chrome"
        uses: browser-actions/setup-chrome@db1b524c26f20a8d1a10f7fc385c92387e2d0477 # v1.7.1
        id: setup-chrome
        if: ${{ matrix.nox-session == 'emscripten(chrome)' }}
        with:
          chrome-version: 135
          install-chromedriver: true
      - name: Force override system chrome
        run: |
          sudo rm -f /usr/bin/google-chrome
          sudo rm -f /usr/bin/chrome
          sudo ln -s ${{ steps.setup-chrome.outputs.chrome-path }} /usr/bin/google-chrome
          sudo ln -s ${{ steps.setup-chrome.outputs.chrome-path }} /usr/bin/chrome
          google-chrome --version
        if: ${{ matrix.nox-session == 'emscripten(chrome)' }}
      - name: "Install Firefox"
        uses: browser-actions/setup-firefox@634a60ccd6599686158cf5a570481b4cd30455a2 # v1.5.4
        if: ${{ matrix.nox-session == 'emscripten(firefox)' }}
      - name: "Install node.js"
        uses: actions/setup-node@v4
        if: ${{ matrix.nox-session == 'emscripten(node)' }}
        with:
          node-version: 22
      - name: Cache pyodide downloads in nox cache
        uses: actions/cache@v4
        if: ${{ startsWith(matrix.nox-session, 'emscripten') }}
        with:
          path: .nox/.cache
          # noxfile.py contains the Pyodide version used currently.
          key: pyodide-downloads-${{ hashFiles('noxfile.py') }}
      - name: "Deselect environment-dependent tests"
        env:
          NOX_SESSION_NAME: ${{ matrix.nox-session }}
        run: |
          # RECENT_DATE (2023-06-01) is hard-coded in src/urllib3/connection.py and this test
          # asserts it is within two years of *today*; it fails by calendar drift alone.
          ADDOPTS="--deselect test/test_connection.py::TestConnection::test_recent_date"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Winsock does not raise from settimeout() after a peer reset, so the test's
            # is_closed_socket() probe cannot observe the teardown on Windows.
            ADDOPTS="$ADDOPTS --deselect test/with_dummyserver/test_socketlevel.py::TestSSL::test_ssl_custom_validation_failure_terminates"
          fi
          if [ "$NOX_SESSION_NAME" = "emscripten(firefox)" ]; then
            # The [firefox-False] tests assert has_jspi() is False, but current Firefox
            # (even a pinned 137.0) exposes WebAssembly JSPI so has_jspi() is True, and
            # urllib3's harness only has a JSPI-disable hook for chrome, not firefox.
            # Deterministic, so the retry loop cannot help; the no-JSPI path is still
            # exercised by the node and chrome legs.
            base="test/contrib/emscripten/test_emscripten.py"
            for t in test_break_worker_streaming test_has_jspi test_has_jspi_worker \
                     test_index test_pool_requests test_streaming_close \
                     test_streaming_download test_streaming_fallback_warning \
                     test_timeout_warning; do
              ADDOPTS="$ADDOPTS --deselect ${base}::${t}[firefox-False]"
            done
          fi
          echo "PYTEST_ADDOPTS=$ADDOPTS" >> "$GITHUB_ENV"
      - name: "Run tests"
        # If no explicit NOX_SESSION is set, run the default tests for the chosen Python version
        run: |
          for attempt in 1 2 3 4 5; do
            echo "pytest attempt ${attempt}/5"
            if [ -n "$TEST_FILTER" ]; then
              uvx nox -s ${NOX_SESSION:-test-$PYTHON_VERSION} -- $TEST_FILTER && exit 0
            else
              uvx nox -s ${NOX_SESSION:-test-$PYTHON_VERSION} && exit 0
            fi
          done
          exit 1
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          NOX_SESSION: ${{ matrix.nox-session }}
          TEST_FILTER: ${{ inputs.test-filter }}

      - name: "Upload coverage data"
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: coverage-data-${{ matrix.python-version }}-${{ matrix.os }}-${{ matrix.experimental }}-${{ matrix.nox-session }}
          path: ".coverage.*"
          if-no-files-found: error


  coverage:
    if: false
    runs-on: "ubuntu-24.04"
    needs: test
    timeout-minutes: 15
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          persist-credentials: false

      - name: "Setup Python"
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.x"

      - name: "Install uv"
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          version: "0.5.20"

      - name: "Install coverage"
        # Install the same version of coverage as in the lock file.
        run: uv sync --dev --frozen

      - name: "Download coverage data"
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: "Combine & check coverage"
        run: |
          uv run -m build
          uv run -m coverage combine
          uv run -m coverage html --skip-covered --skip-empty
          uv run -m coverage report --ignore-errors --show-missing --fail-under=100

      - if: ${{ failure() }}
        name: "Upload report if check failed"
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: coverage-report
          path: htmlcov
