name: Publish to PyPI

on: workflow_dispatch

permissions:
  contents: "read"

jobs:
  build:
    name: "Build distribution 📦"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          fetch-depth: 0 # Needed to fetch the version from git
          persist-credentials: false

      - name: "Setup Python"
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.x"

      - name: "Install dependencies"
        run: python -m pip install build==0.8.0

      - name: "Pin build backend"
        run: printf 'hatchling==1.27.0\n' > build-constraints.txt

      - name: "Build dists"
        run: |
          SOURCE_DATE_EPOCH=1744296956 \
          python -m build
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
          SETUPTOOLS_SCM_PRETEND_VERSION: "2.4.0"
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_URLLIB3: "2.4.0"

      - name: "Generate hashes"
        id: hash
        run: |
          cd dist && echo "hashes=$(sha256sum * | base64 -w0)" >> $GITHUB_OUTPUT

      - name: "Upload dists"
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: "dist"
          path: "dist/"
          if-no-files-found: error
          retention-days: 5
